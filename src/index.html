<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12365a"><title>Sucatas Brasil</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#15263a;background:#eef3f7}*{box-sizing:border-box}body{margin:0}.top{background:#12365a;color:white;padding:18px max(16px,calc((100% - 1100px)/2));display:flex;align-items:center;gap:14px}.logo{font-size:32px}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;color:#d7e5f3}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:white;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 4px 20px #12365a12}h2{margin-top:0;color:#12365a}label{display:block;font-size:14px;font-weight:600;margin:10px 0}input,select,button,textarea{width:100%;padding:11px;border:1px solid #c9d5e1;border-radius:8px;font:inherit}button{background:#13834b;color:white;border:0;font-weight:700;cursor:pointer;margin-top:8px}button.secondary{background:#e4edf5;color:#12365a}button.danger{background:#9d2b2b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.muted{color:#617187;font-size:13px}.hidden{display:none}.status{padding:10px;background:#edf6ee;border-radius:8px;margin:10px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{width:auto;padding:10px 14px}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e1e7ee;font-size:14px}@media(max-width:600px){.wrap{margin:12px auto}.top h1{font-size:20px}}
</style></head><body>
<header class="top"><div class="logo">♻️ 🇧🇷</div><div><h1>SUCATAS BRASIL</h1><p>Gestão das unidades Sete Quedas e Jardim</p></div></header>
<main class="wrap">
<section id="loginCard" class="card"><h2>Acessar sistema</h2><div id="setupNote" class="muted">Se este for o primeiro acesso, use a opção de configuração inicial.</div><form id="loginForm" class="grid"><label>E-mail<input name="email" type="email" required autocomplete="username"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><div><button>Entrar</button></div></form><button class="secondary" id="showSetup">Configuração inicial do administrador</button><form id="setupForm" class="grid hidden"><label>Nome<input name="name" required></label><label>E-mail<input name="email" type="email" required></label><label>Unidade<select name="unit"><option>Sete Quedas</option><option>Jardim</option></select></label><label>Senha (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><div><button>Criar administrador</button></div></form><p id="loginStatus" class="muted"></p></section>
<section id="app" class="hidden"><div class="card"><div class="grid"><div><h2 id="welcome">Painel</h2><p id="userMeta" class="muted"></p></div><label id="unitWrap">Unidade<select id="unitSelect"><option>Sete Quedas</option><option>Jardim</option></select></label></div><div class="nav"><button data-page="stock">Estoque</button><button data-page="purchase">Comprar sucata</button><button data-page="sale">Vender</button><button data-page="cash">Caixa</button><button data-page="transfer">Transferências</button><button data-page="reports">Resumo diário</button><button data-page="users" id="usersNav" class="hidden">Usuários</button><button id="logout" class="secondary">Sair</button></div><p id="appStatus" class="muted"></p></div>
<section id="page-stock" class="card"><h2>Estoque</h2><form id="stockForm" class="grid"><label>Categoria<select name="category"><option value="sucata">Sucata</option><option value="reaproveitado">Reaproveitado</option><option value="novo">Produto novo</option></select></label><label>Produto/material<input name="product" required></label><label>Unidade de medida<select name="measure"><option>kg</option><option>un</option><option>m</option><option>l</option></select></label><label>Quantidade atual<input name="quantity" type="number" min="0" step="0.001" required></label><div><button>Salvar saldo inicial/ajuste</button></div></form><div id="stockTable" class="table"></div></section>
<section id="page-purchase" class="card hidden"><h2>Compra de sucata</h2><form id="purchaseForm" class="grid"><label>Vendedor/fornecedor<input name="seller" required></label><label>Material<input name="material" required></label><label>Peso bruto (kg)<input name="gross" type="number" min="0.001" step="0.001" required></label><label>Tara (kg)<input name="tare" type="number" min="0" step="0.001" value="0" required></label><label>Preço por kg (R$)<input name="price_kg" type="number" min="0" step="0.01" required></label><label>Pagamento<select name="payment"><option>dinheiro</option><option>pix</option><option>transferência</option><option>cartão</option></select></label><label>Observações<input name="notes"></label><div><button>Registrar compra</button></div></form></section>
<section id="page-sale" class="card hidden"><h2>Venda</h2><form id="saleForm" class="grid"><label>Categoria<select name="category"><option value="sucata">Sucata</option><option value="reaproveitado">Reaproveitado</option><option value="novo">Produto novo</option></select></label><label>Produto (nome exato do estoque)<input name="product" required></label><label>Quantidade<input name="qty" type="number" min="0.001" step="0.001" required></label><label>Medida<select name="measure"><option>kg</option><option>un</option><option>m</option><option>l</option></select></label><label>Preço unitário (R$)<input name="price" type="number" min="0" step="0.01" required></label><label>Pagamento<select name="payment"><option>dinheiro</option><option>pix</option><option>transferência</option><option>cartão</option></select></label><div><button>Registrar venda</button></div></form></section>
<section id="page-cash" class="card hidden"><h2>Movimentação de caixa</h2><form id="cashForm" class="grid"><label>Tipo<select name="direction"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></label><label>Categoria<input name="category" required placeholder="Ex.: despesa, ajuste"></label><label>Valor (R$)<input name="amount" type="number" min="0" step="0.01" required></label><label>Pagamento<select name="payment"><option>dinheiro</option><option>pix</option><option>transferência</option><option>cartão</option></select></label><label>Descrição<input name="description" required></label><div><button>Registrar movimento</button></div></form><div id="cashTable" class="table"></div></section>
<section id="page-transfer" class="card hidden"><h2>Transferência entre unidades</h2><form id="transferForm" class="grid"><label>Destino<select name="destination"><option>Sete Quedas</option><option>Jardim</option></select></label><label>Categoria<select name="category"><option value="sucata">Sucata</option><option value="reaproveitado">Reaproveitado</option><option value="novo">Produto novo</option></select></label><label>Produto (nome exato do estoque)<input name="product" required></label><label>Quantidade<input name="qty" type="number" min="0.001" step="0.001" required></label><label>Medida<select name="measure"><option>kg</option><option>un</option><option>m</option><option>l</option></select></label><label>Observações<input name="notes"></label><div><button>Enviar transferência</button></div></form><div id="transferTable" class="table"></div></section>
<section id="page-reports" class="card hidden"><h2>Resumo de caixa de hoje</h2><button id="refreshReport">Atualizar resumo</button><div id="report"></div></section>
<section id="page-users" class="card hidden"><h2>Usuários (administrador)</h2><form id="userForm" class="grid"><label>Nome<input name="name" required></label><label>E-mail<input name="email" type="email" required></label><label>Perfil<select name="role"><option value="gerente">Gerente</option><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></label><label>Unidade<select name="unit"><option>Sete Quedas</option><option>Jardim</option></select></label><label>Senha inicial (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required></label><div><button>Criar usuário</button></div></form><div id="usersTable" class="table"></div></section>
</section></main>
<script>
let token="",me=null,unit="";
const $=s=>document.querySelector(s);
async function api(path,method="GET",data){const r=await fetch(path,{method,headers:{"content-type":"application/json",...(token?{authorization:"Bearer "+token}:{})},...(data?{body:JSON.stringify(data)}:{})});let x={};try{x=await r.json()}catch{}if(!r.ok)throw Error(x.error||("Erro HTTP "+r.status));return x}
function formData(f){return Object.fromEntries(new FormData(f).entries())}
function message(s){$("#appStatus").textContent=s;$("#loginStatus").textContent=s}
function table(el,rows,cols){if(!rows.length){$(el).innerHTML="<p class='muted'>Nenhum registro.</p>";return}$(el).innerHTML="<table><thead><tr>"+cols.map(c=>"<th>"+c[1]+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+String(r[c[0]]??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}
async function refresh(){try{const s=await api("/api/stock?unit="+encodeURIComponent(unit));table("#stockTable",s.items,[["category","Categoria"],["product","Produto"],["quantity","Quantidade"],["measure","Medida"]]);const c=await api("/api/cash?unit="+encodeURIComponent(unit));table("#cashTable",c.items,[["created_at","Data"],["direction","Tipo"],["category","Categoria"],["amount","Valor"],["payment","Pagamento"],["description","Descrição"]]);const t=await api("/api/transfers?unit="+encodeURIComponent(unit));const rows=t.items.map(x=>({...x,unit_label:x.origin+" → "+x.destination}));table("#transferTable",rows,[["unit_label","Trajeto"],["product","Produto"],["qty","Quantidade"],["status","Status"],["created_at","Data"]]);}catch(e){message(e.message)}}
function showPage(p){document.querySelectorAll('[id^="page-"]').forEach(x=>x.classList.add("hidden"));$("#page-"+p).classList.remove("hidden")}
async function enter(x){token=x.token;me=x.user;unit=me.unit;$("#loginCard").classList.add("hidden");$("#app").classList.remove("hidden");$("#welcome").textContent="Olá, "+me.name;$("#userMeta").textContent=me.role+" • "+me.unit;$("#unitWrap").classList.toggle("hidden",me.role!=="admin");$("#unitSelect").value=unit;$("#usersNav").classList.toggle("hidden",me.role!=="admin");await refresh()}
$("#showSetup").onclick=()=>$("#setupForm").classList.toggle("hidden");
$("#loginForm").onsubmit=async e=>{e.preventDefault();try{const x=await api("/api/login","POST",formData(e.target));await enter(x);message("Login realizado.")}catch(err){message(err.message)}};
$("#setupForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/setup","POST",formData(e.target));$("#loginStatus").textContent="Administrador criado. Entre com seu e-mail e senha.";$("#setupForm").reset()}catch(err){$("#loginStatus").textContent=err.message}};
$("#logout").onclick=()=>{token="";me=null;$("#app").classList.add("hidden");$("#loginCard").classList.remove("hidden")};
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{showPage(b.dataset.page);if(b.dataset.page==="users")loadUsers();if(b.dataset.page==="reports")loadReport()});
$("#unitSelect").onchange=async()=>{unit=$("#unitSelect").value;await refresh()};
$("#stockForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/stock?unit="+encodeURIComponent(unit),"POST",{...formData(e.target),quantity:Number(e.target.quantity.value)});message("Estoque atualizado.");e.target.reset();await refresh()}catch(err){message(err.message)}};
$("#purchaseForm").onsubmit=async e=>{e.preventDefault();try{const x=await api("/api/purchases?unit="+encodeURIComponent(unit),"POST",formData(e.target));message(`Compra registrada: ${x.net} kg, total R$ ${Number(x.total).toFixed(2)}.`);e.target.reset();await refresh()}catch(err){message(err.message)}};
$("#saleForm").onsubmit=async e=>{e.preventDefault();try{const x=await api("/api/sales?unit="+encodeURIComponent(unit),"POST",{...formData(e.target),qty:Number(e.target.qty.value),price:Number(e.target.price.value)});message("Venda registrada: R$ "+Number(x.total).toFixed(2));e.target.reset();await refresh()}catch(err){message(err.message)}};
$("#cashForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/cash?unit="+encodeURIComponent(unit),"POST",{...formData(e.target),amount:Number(e.target.amount.value)});message("Movimentação registrada.");e.target.reset();await refresh()}catch(err){message(err.message)}};
$("#transferForm").onsubmit=async e=>{e.preventDefault();try{const d=formData(e.target);if(d.destination===unit)throw Error("Escolha a outra unidade como destino.");await api("/api/transfers?unit="+encodeURIComponent(unit),"POST",{...d,qty:Number(d.qty)});message("Transferência enviada.");e.target.reset();await refresh()}catch(err){message(err.message)}};
$("#refreshReport").onclick=loadReport;
async function loadReport(){try{const r=await api("/api/reports/cash-summary?unit="+encodeURIComponent(unit));$("#report").innerHTML=`<p>Entradas: R$ ${Number(r.entradas).toFixed(2)}</p><p>Saídas: R$ ${Number(r.saidas).toFixed(2)}</p><p><b>Saldo: R$ ${Number(r.saldo).toFixed(2)}</b></p>`}catch(e){message(e.message)}}
async function loadUsers(){try{const r=await api("/api/users");table("#usersTable",r.items,[["name","Nome"],["email","E-mail"],["role","Perfil"],["unit","Unidade"],["active","Ativo"]])}catch(e){message(e.message)}}
$("#userForm").onsubmit=async e=>{e.preventDefault();try{await api("/api/users","POST",formData(e.target));e.target.reset();await loadUsers();message("Usuário criado.")}catch(err){message(err.message)}};
showPage("stock");
</script></body></html>
